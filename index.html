<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Track workouts, rest periods, and nutrition shopping lists — all in one sleek gym companion app." />
  <meta name="theme-color" content="#0a0c10" id="meta-theme-color" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Plates" />
  <link rel="icon" type="image/jpeg" href="icon-512.jpg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-512.jpg" />
  <title>Plates — Workout Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <!-- ───── Top Bar ───── -->
  <header id="app-header">
    <div class="header-inner">
      <div class="logo">
        <svg class="plate-logo-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Plates icon">
          <!-- Outer rim -->
          <circle cx="18" cy="18" r="16.5" stroke="currentColor" stroke-width="2.2" class="plate-outer"/>
          <circle cx="18" cy="18" r="14" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.45"/>
          <!-- Recess rim -->
          <circle cx="18" cy="18" r="11" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
          <!-- Center hub collar -->
          <circle cx="18" cy="18" r="6" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1.6" class="plate-hub"/>
          <!-- Center barbell hole -->
          <circle cx="18" cy="18" r="3.2" fill="var(--bg-base)" stroke="currentColor" stroke-width="1.4"/>
          <!-- Bushing bolts -->
          <circle cx="18" cy="13.2" r="0.9" fill="currentColor" opacity="0.8"/>
          <circle cx="18" cy="22.8" r="0.9" fill="currentColor" opacity="0.8"/>
          <circle cx="13.2" cy="18" r="0.9" fill="currentColor" opacity="0.8"/>
          <circle cx="22.8" cy="18" r="0.9" fill="currentColor" opacity="0.8"/>
        </svg>
        <span class="logo-text">PLA<span class="accent">TES</span></span>
      </div>
      <div class="header-actions">
        <div class="goal-selector">
          <label for="goal-select">Goal</label>
          <select id="goal-select">
            <option value="strength">Build Strength</option>
            <option value="hypertrophy">Hypertrophy</option>
            <option value="endurance">Endurance</option>
            <option value="weight-loss">Weight Loss</option>
            <option value="hiit">HIIT</option>
            <option value="powerlifting">Powerlifting</option>
          </select>
        </div>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Switch theme" title="Toggle Light / Dark Theme">
          <span class="theme-toggle-indicator">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </span>
        </button>
      </div>
    </div>
  </header>

  <!-- ───── Navigation Tabs ───── -->
  <nav id="main-nav">
    <button class="nav-btn active" data-tab="workouts">
      <span class="nav-icon">💪</span>
      <span class="nav-label">Workouts</span>
    </button>
    <button class="nav-btn" data-tab="timer">
      <span class="nav-icon">⏱️</span>
      <span class="nav-label">Rest Timer</span>
    </button>
    <button class="nav-btn" data-tab="history">
      <span class="nav-icon">📊</span>
      <span class="nav-label">History</span>
    </button>
    <button class="nav-btn" data-tab="shopping">
      <span class="nav-icon">🛒</span>
      <span class="nav-label">Shopping</span>
    </button>
  </nav>

  <!-- ───── Main Content ───── -->
  <main id="app-main">

    <!-- ── WORKOUTS TAB ── -->
    <section id="tab-workouts" class="tab-panel active">
      <div class="section-header">
        <h1>My Routines</h1>
        <button id="btn-add-routine" class="btn-primary">+ Add Routine</button>
      </div>
      <p class="subtitle">Track up to 12 workout routines. Tap a routine to log sets.</p>
      <div id="routines-grid" class="routines-grid">
        <!-- cards injected by JS -->
      </div>
    </section>

    <!-- ── REST TIMER TAB ── -->
    <section id="tab-timer" class="tab-panel">
      <div class="timer-container">
        <h1>Rest Timer</h1>
        <p class="subtitle" id="rest-recommendation">Select a goal to see recommended rest.</p>
        <div class="timer-display">
          <svg class="timer-ring" viewBox="0 0 200 200">
            <circle class="ring-bg" cx="100" cy="100" r="90" />
            <circle class="ring-progress" cx="100" cy="100" r="90" id="timer-ring-progress" />
          </svg>
          <div class="timer-digits" id="timer-digits">0:00</div>
        </div>
        <div class="timer-presets" id="timer-presets">
          <!-- preset buttons injected by JS -->
        </div>
        <div class="timer-controls">
          <button id="btn-timer-start" class="btn-primary">Start</button>
          <button id="btn-timer-reset" class="btn-secondary">Reset</button>
        </div>
      </div>
    </section>

    <!-- ── HISTORY TAB ── -->
    <section id="tab-history" class="tab-panel">
      <div class="section-header">
        <h1>Workout History</h1>
        <button id="btn-clear-history" class="btn-danger">Clear All</button>
      </div>
      <p class="subtitle">Review past workout logs grouped by date.</p>
      <div id="history-list" class="history-list">
        <!-- entries injected by JS -->
      </div>
    </section>

    <!-- ── SHOPPING TAB ── -->
    <section id="tab-shopping" class="tab-panel">
      <div class="section-header">
        <h1>Shopping List</h1>
      </div>
      <p class="subtitle">Keep track of supplements, meals & groceries.</p>
      <div class="shopping-input-row">
        <input type="text" id="shopping-input" placeholder="Add an item…" />
        <select id="shopping-category">
          <option value="protein">🥩 Protein</option>
          <option value="supplements">💊 Supplements</option>
          <option value="carbs">🍚 Carbs</option>
          <option value="fruits-veg">🥦 Fruits & Veg</option>
          <option value="dairy">🥛 Dairy</option>
          <option value="other">📦 Other</option>
        </select>
        <button id="btn-add-shopping" class="btn-primary">Add</button>
      </div>
      <div id="shopping-list" class="shopping-list">
        <!-- items injected by JS -->
      </div>
    </section>

  </main>

  <!-- ───── Modal: Add / Edit Routine ───── -->
  <div id="modal-routine" class="modal-overlay" hidden>
    <div class="modal">
      <h2 id="modal-routine-title">Add Routine</h2>
      <div class="form-group">
        <label for="routine-name">Routine Name</label>
        <input type="text" id="routine-name" placeholder="e.g. Chest & Triceps" maxlength="40" />
      </div>
      <div id="exercise-list" class="exercise-list">
        <!-- exercise rows injected by JS -->
      </div>
      <button id="btn-add-exercise" class="btn-secondary btn-small">+ Add Exercise</button>
      <div class="modal-actions">
        <button id="btn-save-routine" class="btn-primary">Save</button>
        <button id="btn-cancel-routine" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ───── Modal: Log Workout ───── -->
  <div id="modal-log" class="modal-overlay" hidden>
    <div class="modal">
      <h2 id="modal-log-title">Log Workout</h2>
      <div id="log-exercises" class="log-exercises">
        <!-- log rows injected by JS -->
      </div>
      <div class="modal-actions">
        <button id="btn-save-log" class="btn-primary">Save Log</button>
        <button id="btn-cancel-log" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
